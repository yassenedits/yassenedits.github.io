<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yassen — Video Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --bg2:#050505;
    --card:#000000;
    --orange:#FFFFFF;
    --orange-strong:#FFFFFF;
    --amber:#FFFFFF;
    --text:#FFFFFF;
    --text-soft:rgba(255,255,255,.55);
    --border:rgba(255,255,255,.16);
    --radius:20px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    line-height:1.5;
    overflow-x:hidden;
    position:relative;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:1120px; margin:0 auto; padding:0 32px;}
  ::selection{background:var(--orange-strong); color:#000;}
  h1,h2,h3{
    font-family:'Bricolage Grotesque', sans-serif;
    letter-spacing:-0.01em;
  }
  .tc{
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--text-soft);
  }
  :focus-visible{outline:2px solid var(--orange-strong); outline-offset:3px;}
  .grad-text{
    background:linear-gradient(135deg, var(--orange-strong), var(--amber) 80%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  /* SPOTLIGHT GLOW ON MOUSE MOVE */
  .mouse-spotlight{
    position:fixed;
    width:650px;
    height:650px;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
    background:radial-gradient(circle, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.02) 40%, transparent 70%);
    transform:translate(-50%, -50%);
    transition:transform 0.15s ease-out;
  }

  /* AMBIENT BACKGROUND */
  .bg-ambient{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .blob{position:absolute; border-radius:50%; filter:blur(110px); opacity:.35;}
  .blob-a{width:560px; height:560px; background:var(--orange-strong); top:-180px; left:-140px; animation:blobFloat1 26s ease-in-out infinite;}
  .blob-b{width:500px; height:500px; background:var(--amber); bottom:-200px; right:-120px; animation:blobFloat2 30s ease-in-out infinite;}
  .blob-c{width:380px; height:380px; background:var(--orange); top:40%; left:50%; opacity:.18; animation:blobFloat3 34s ease-in-out infinite;}
  .blob-d{width:320px; height:320px; background:var(--orange-strong); top:8%; right:8%; opacity:.18; animation:blobFloat4 38s ease-in-out infinite;}
  @keyframes blobFloat1{0%,100%{transform:translate(0,0);}50%{transform:translate(70px,50px);}}
  @keyframes blobFloat2{0%,100%{transform:translate(0,0);}50%{transform:translate(-60px,-40px);}}
  @keyframes blobFloat3{0%,100%{transform:translate(-50%,-50%) scale(1);}50%{transform:translate(-50%,-50%) scale(1.2);}}
  @keyframes blobFloat4{0%,100%{transform:translate(0,0);}50%{transform:translate(-50px,60px);}}
  header, main, footer{position:relative; z-index:1;}

  /* SCROLL PROGRESS */
  .scroll-bar{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:linear-gradient(90deg, #fff, rgba(255,255,255,0.5));
    z-index:200; transition:width .1s linear;
  }

  /* INTRO SCREEN - ZOOM THROUGH PORTAL */
  .intro-screen{
    position:fixed; inset:0; z-index:9999; background:#000000;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .65s cubic-bezier(.16,1,.3,1), visibility .65s ease;
  }
  .intro-screen.portal-zoom{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .intro-content{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    perspective:1000px;
  }
  .intro-logo-box{
    position:relative;
    display:inline-block;
    transition:transform 0.85s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.8s ease, filter 0.8s ease;
  }
  .intro-screen.portal-zoom .intro-logo-box{
    transform:scale(35);
    opacity:0;
    filter:blur(18px);
  }
  .intro-logo{
    height:90px; width:auto; object-fit:contain;
    opacity:0;
    animation:introLogoGlow 1.2s cubic-bezier(.16,1,.3,1) 0.1s forwards;
  }
  @keyframes introLogoGlow{
    0%{opacity:0; transform:scale(0.85); filter:drop-shadow(0 0 0 rgba(255,255,255,0));}
    60%{opacity:1; transform:scale(1.04); filter:drop-shadow(0 0 35px rgba(255,255,255,0.6));}
    100%{opacity:1; transform:scale(1); filter:drop-shadow(0 0 15px rgba(255,255,255,0.3));}
  }
  .intro-meta{
    margin-top:24px;
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    color:rgba(255,255,255,0.6);
    opacity:0;
    animation:introFade 0.6s ease 0.6s forwards;
  }
  .intro-rec-dot{
    width:8px; height:8px; border-radius:50%; background:#ff3333;
    animation:pulseRec 1s infinite;
  }
  @keyframes pulseRec{0%,100%{opacity:1;} 50%{opacity:0.25;}}
  @keyframes introFade{to{opacity:1;}}
  .intro-bar{width:160px; height:2px; background:rgba(255,255,255,.15); margin:20px auto 0; border-radius:4px; overflow:hidden;}
  .intro-bar::after{content:''; display:block; height:100%; width:0%; background:#fff; animation:introBarFill 1.4s cubic-bezier(.2,.8,.2,1) 0.4s forwards;}
  @keyframes introBarFill{to{width:100%;}}

  /* REVEAL */
  .reveal{
    opacity:0; transform:translateY(26px); filter:blur(8px);
    transition:opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1), filter .8s ease;
  }
  .reveal.in{opacity:1; transform:translateY(0); filter:blur(0);}

  /* GLASS PANEL */
  .glass{
    background:rgba(23,23,23,.4);
    backdrop-filter:blur(32px) saturate(220%);
    -webkit-backdrop-filter:blur(32px) saturate(220%);
    border:1px solid rgba(245,245,245,.14);
    position:relative;
    overflow:hidden;
  }
  .glass::before{
    content:''; position:absolute; inset:0; border-radius:inherit;
    background:linear-gradient(135deg, rgba(255,255,255,.12), transparent 45%);
    pointer-events:none;
  }

  /* NAV */
  header{position:fixed; top:16px; left:0; right:0; z-index:100; display:flex; justify-content:center; padding:0 16px;}
  nav{
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(70px) saturate(180%);
    -webkit-backdrop-filter:blur(70px) saturate(180%);
    border:1px solid rgba(255,255,255,.35);
    border-radius:999px;
    padding:8px 8px 8px 18px;
    max-width:1056px; width:100%;
    box-shadow:0 8px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.04), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.1);
  }
  .brand{display:flex; align-items:center; gap:9px; font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:18px; transition:transform .25s cubic-bezier(.16,1,.3,1);}
  .brand:hover{transform:scale(1.06);}
  .brand-logo{height:26px; width:auto; object-fit:contain;}
  .navlinks{position:relative; display:flex; gap:2px; padding:4px; background:rgba(255,255,255,.03); border-radius:999px;}
  .navlinks a{
    position:relative; z-index:2; padding:8px 16px; border-radius:999px;
    font-size:14px; font-weight:500; color:var(--text-soft);
    transition:color .3s ease, transform .25s cubic-bezier(.16,1,.3,1);
    white-space:nowrap; display:inline-block;
  }
  .navlinks a.active, .navlinks a:hover{color:var(--text);}
  .navlinks a:hover{transform:scale(1.15);}
  .nav-indicator{
    position:absolute; top:4px; left:4px; height:calc(100% - 8px); width:0;
    background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.45); border-radius:999px;
    transition:left .4s cubic-bezier(.16,1,.3,1), width .4s cubic-bezier(.16,1,.3,1);
    z-index:1;
  }
  .navcta{
    display:flex; align-items:center; gap:8px;
    background:linear-gradient(135deg, var(--orange-strong), var(--orange));
    color:#000000; padding:10px 18px;
    border-radius:999px; font-size:14px; font-weight:600;
    transition:transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease;
  }
  .navcta:hover{transform:translateY(-1px); box-shadow:0 8px 20px -6px rgba(255,255,255,.6);}
  .navcta-icon{display:none; width:18px; height:18px; fill:#000;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--orange-strong); display:inline-block; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  /* HERO */
  .hero{padding:168px 0 40px; position:relative;}
  .hero-rec-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:6px 14px;
    border-radius:999px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.18);
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    font-weight:700;
    letter-spacing:0.12em;
    color:rgba(255,255,255,0.85);
    margin-bottom:22px;
    backdrop-filter:blur(20px);
  }
  .hero-rec-dot{
    width:7px; height:7px; border-radius:50%; background:#ff3333;
    box-shadow:0 0 8px #ff3333;
    animation:pulseRec 1.2s infinite;
  }
  .hero-grid{
    display:grid; grid-template-columns:1fr; gap:36px; align-items:center; max-width:720px; text-align:center; margin:0 auto;
  }
  .logo-hero{position:relative; width:240px; height:120px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; perspective:700px;}
  .logo-img{
    position:relative; height:94px; width:auto; object-fit:contain;
    opacity:0;
    clip-path:inset(0 100% 0 0);
    transform:scale(.94);
    animation:none;
  }
  .hero-play .logo-img{animation:logoIn 1.15s cubic-bezier(.16,1,.3,1) forwards;}
  @keyframes logoIn{
    0%{opacity:0; clip-path:inset(0 100% 0 0); transform:scale(.94);}
    6%{opacity:1;}
    72%{clip-path:inset(0 0% 0 0); transform:scale(1.04);}
    100%{clip-path:inset(0 0% 0 0); transform:scale(1); opacity:1;}
  }
  .hero h1{
    font-size:clamp(46px, 7.5vw, 84px);
    font-weight:800;
    line-height:1.02;
    overflow:hidden;
    text-shadow:0 0 35px rgba(255,255,255,.35);
  }
  .hero h1 span{display:block; overflow:hidden;}
  .hero h1 .word{
    display:inline-block;
    transform:translateY(40%);
    filter:blur(10px);
    opacity:0;
    animation:none;
  }
  .hero-play h1 .word{animation:heroWordIn .85s cubic-bezier(.16,1,.3,1) var(--d,0s) forwards;}
  @keyframes heroWordIn{
    0%{transform:translateY(40%); filter:blur(10px); opacity:0;}
    100%{transform:translateY(0); filter:blur(0); opacity:1;}
  }
  .hero .role{
    font-size:clamp(17px,2.2vw,21px); color:var(--text-soft); font-weight:500;
    margin:18px auto 0; max-width:480px;
    opacity:0; transform:translateY(16px);
    animation:none;
  }
  .hero-play .role{animation:heroFade .8s cubic-bezier(.16,1,.3,1) .55s forwards;}
  .hero-actions{display:flex; gap:14px; margin-top:34px; flex-wrap:wrap; justify-content:center;
    opacity:0; transform:translateY(16px);
    animation:none;
  }
  .hero-play .hero-actions{animation:heroFade .8s cubic-bezier(.16,1,.3,1) .7s forwards;}
  @keyframes heroFade{to{opacity:1; transform:translateY(0);}}
  .btn{
    padding:14px 24px; border-radius:999px; font-weight:600; font-size:15px;
    display:inline-flex; align-items:center; gap:8px;
    transition:transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease, background .25s ease;
  }
  .btn-primary{
    background:rgba(255,255,255,.14);
    backdrop-filter:blur(30px) saturate(200%); -webkit-backdrop-filter:blur(30px) saturate(200%);
    border:1px solid rgba(255,255,255,.4);
    box-shadow:0 6px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.4);
    color:#fff;
  }
  .btn-primary:hover{transform:translateY(-2px) scale(1.04); background:rgba(255,255,255,.22); box-shadow:0 14px 28px -10px rgba(255,255,255,.35), inset 0 1px 0 rgba(255,255,255,.5);}
  .btn-ghost{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(26px) saturate(180%); -webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1.5px solid rgba(255,255,255,.22);
    box-shadow:0 6px 16px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.2);
    color:var(--text);
  }
  .btn-ghost:hover{
    background:rgba(49,224,122,.14);
    border-color:rgba(49,224,122,.55);
    box-shadow:0 6px 20px rgba(49,224,122,.3), inset 0 1px 0 rgba(255,255,255,.2);
    color:#5EF08F;
    transform:translateY(-2px);
  }

  section{padding:110px 0;}
  .section-head{
    display:inline-flex; align-items:baseline; gap:16px; margin-bottom:48px;
    padding:14px 28px; border-radius:999px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(30px) saturate(200%); -webkit-backdrop-filter:blur(30px) saturate(200%);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 6px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .section-head h2{font-size:clamp(22px,3vw,28px); font-weight:700; text-shadow:0 0 22px rgba(255,255,255,.35);}
  .section-head .tc{white-space:nowrap;}

  /* ABOUT */
  .about-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:64px; align-items:start;}
  .about-text p{font-size:18px; color:rgba(255,255,255,.72); max-width:520px;}
  .about-text p + p{margin-top:16px;}
  .facts{display:grid; grid-template-columns:1fr 1fr; gap:1px; border-radius:var(--radius); overflow:hidden;}
  .fact{padding:22px 20px;}
  .fact .tc{display:block; margin-bottom:6px;}
  .fact strong{font-size:16px; font-weight:600;}

  /* SERVICES */
  .services{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  .service{
    border-radius:var(--radius);
    padding:32px 26px; transition:transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease, border-color .25s ease;
  }
  .service:hover{transform:translateY(-6px); box-shadow:0 24px 46px -24px rgba(0,0,0,.6); border-color:rgba(255,255,255,.35) !important;}
  .service .num{font-family:'Inter',sans-serif; font-weight:700; font-size:14px; letter-spacing:0.04em; color:var(--orange-strong); margin-bottom:20px; display:block;}
  .service:nth-child(2) .num{color:var(--amber);}
  .service h3{
    font-size:19px; font-weight:700; margin-bottom:14px; display:inline-block;
    padding:8px 18px; border-radius:999px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(30px) saturate(200%); -webkit-backdrop-filter:blur(30px) saturate(200%);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 6px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .25s cubic-bezier(.16,1,.3,1);
  }
  .service:hover h3{transform:scale(1.05);}
  .service p{color:var(--text-soft); font-size:15px;}

  /* WORK */
  .work-nav{
    display:flex; justify-content:center; gap:4px; width:100%;
    margin-bottom:56px; padding:6px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(60px) saturate(180%); -webkit-backdrop-filter:blur(60px) saturate(180%);
    border:1px solid rgba(255,255,255,.35); border-radius:999px;
    box-shadow:0 8px 32px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.1);
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .work-nav::-webkit-scrollbar{display:none;}
  .work-nav a{
    flex:1; text-align:center; padding:11px 18px; border-radius:999px;
    font-size:14px; font-weight:600; font-family:'Inter', sans-serif;
    color:var(--text-soft); white-space:nowrap;
    transition:color .3s ease, background .3s ease, transform .25s cubic-bezier(.16,1,.3,1);
  }
  .work-nav a:hover{color:var(--text); background:rgba(255,255,255,.1); transform:scale(1.08);}
  .work-group{margin-bottom:64px; scroll-margin-top:120px;}
  .work-group:last-child{margin-bottom:0;}
  .work-group-head{margin-bottom:28px;}
  .work-group-head h3{
    display:inline-block; padding:10px 24px; border-radius:999px;
    font-size:17px; font-weight:700; font-family:'Bricolage Grotesque', sans-serif;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(30px) saturate(200%); -webkit-backdrop-filter:blur(30px) saturate(200%);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 6px 18px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .watch-hint{
    position:absolute; bottom:16px; right:16px; z-index:2;
    background:rgba(255,255,255,.16); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.3); border-radius:999px;
    padding:6px 13px; font-size:11.5px; font-weight:700; color:#fff; letter-spacing:.03em;
    opacity:0; transform:translateY(6px);
    transition:opacity .25s ease, transform .25s ease;
  }
  .work-item:hover .watch-hint{opacity:1; transform:translateY(0);}
  .work-list{display:grid; grid-template-columns:repeat(3, 1fr); gap:22px;}
  .work-item{
    position:relative; display:block; border-radius:var(--radius); overflow:hidden;
    aspect-ratio:9/13; background:var(--card); border:1px solid var(--border);
    transition:transform .3s cubic-bezier(.16,1,.3,1), box-shadow .3s ease;
  }
